services:
  ai-checkin:
    build: .
    container_name: ai-checkin
    user: "1000:1000"   # 对齐 NAS bind mount 属主（基座镜像 appuser 是 1002）
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"   # 面板随守护同进程提供（PANEL_PORT 可改，v1.5.0 合并部署）
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai

  # v1.4.8 起面板与守护合并为单容器；如需回滚，恢复 ai-checkin-web 服务：
  #   ai-checkin-web: { build: ., command: ["web", "--port", "8000"], ... }
