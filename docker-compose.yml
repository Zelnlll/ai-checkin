services:
  ai-checkin:
    build: .
    container_name: ai-checkin
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai

  ai-checkin-web:
    build: .
    container_name: ai-checkin-web
    command: ["web", "--port", "8000"]
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
